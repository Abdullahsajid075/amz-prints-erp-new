<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Printings Pvt Ltd — Print Book Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #F26522;
  --orange-deep: #D45512;
  --ink: #0E141B;
  --black: #07090c;
  --paper: #f4f1ec;
  --muted: #9aa3ae;
  --display: "Unbounded", sans-serif;
  --body: "Manrope", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--body);
  background: #12151a;
  color: #fff;
  overflow: hidden;
}
.bar {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: #0E141B;
  border-bottom: 1px solid rgba(242,101,34,.25);
}
.bar strong { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.bar span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 8px; align-items: center; }
.nav button {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,.2);
  padding: 8px 14px;
  font-family: var(--body);
  font-weight: 700;
  cursor: pointer;
}
.nav button.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.stage {
  height: calc(100% - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(242,101,34,.12), transparent 50%),
    #1a1e24;
}
.spread {
  display: none;
  gap: 0;
  filter: drop-shadow(0 30px 50px rgba(0,0,0,.55));
}
.spread.is-on { display: flex; }
.page {
  width: min(38vw, 420px);
  height: min(76vh, 620px);
  position: relative;
  overflow: hidden;
  background: var(--ink);
}
.page--cover, .page--back { width: min(42vw, 460px); }
.bleed {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
}
.bleed::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 45%, rgba(7,9,12,.75));
}
.cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 18px 22px;
  z-index: 2;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 800;
  color: #fff;
}
.cap b { color: var(--orange); display: block; font-size: 11px; margin-bottom: 4px; }

.cover {
  background: var(--black);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 36px 32px 40px;
  border: 1px solid rgba(242,101,34,.35);
}
.cover .photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: .38;
  filter: grayscale(.35) contrast(1.1);
}
.cover .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(7,9,12,.2) 0%, rgba(7,9,12,.55) 40%, rgba(7,9,12,.96) 78%);
}
.cover .copy { position: relative; z-index: 2; }
.cover .year {
  font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--orange); font-weight: 800; margin-bottom: 18px;
}
.cover h1 {
  font-family: var(--display);
  font-size: clamp(28px, 3.4vw, 44px);
  line-height: .95;
  font-weight: 800;
  letter-spacing: -.02em;
}
.cover h1 em { font-style: normal; color: var(--orange); display: block; }
.cover .rule { width: 72px; height: 4px; background: var(--orange); margin: 22px 0 16px; }
.cover h2 {
  font-family: var(--body);
  font-size: 15px;
  font-weight: 700;
  color: rgba(255,255,255,.88);
  line-height: 1.4;
}
.cover h2 small {
  display: block;
  margin-top: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.text {
  background: var(--black);
  padding: 36px 32px 28px;
  display: flex;
  flex-direction: column;
}
.text .kicker {
  color: var(--orange);
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 14px;
}
.text h2 {
  font-family: var(--display);
  font-size: clamp(26px, 2.8vw, 38px);
  line-height: 1.02;
  margin-bottom: 16px;
}
.text p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(255,255,255,.78);
  margin-bottom: 12px;
}
.text .big {
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.35;
  color: #fff;
  margin-bottom: 16px;
}
.subs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
  overflow: auto;
  flex: 1;
}
.sub {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 8px;
  align-items: center;
  background: #12161c;
  border: 1px solid rgba(255,255,255,.06);
  padding: 6px;
}
.sub img { width: 44px; height: 44px; object-fit: cover; display: block; }
.sub span { font-size: 11px; font-weight: 700; line-height: 1.25; color: #fff; }

.values { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.values div {
  border: 1px solid rgba(242,101,34,.35);
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 800;
}

.folio { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; padding: 16px; background: var(--black); }
.folio figure { margin: 0; position: relative; overflow: hidden; }
.folio img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 140px; }
.folio figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 8px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  font-size: 11px; font-weight: 800;
}

.contact { background: var(--black); padding: 36px 32px; }
.contact h2 { font-family: var(--display); font-size: 32px; margin: 10px 0 18px; }
.contact p { font-size: 15px; line-height: 1.5; margin: 4px 0; }
.contact .wa { color: var(--orange); font-weight: 800; font-size: 18px; margin-top: 12px; }

@media (max-width: 900px) {
  .page, .page--cover, .page--back { width: min(92vw, 420px); height: min(70vh, 560px); }
  .spread.is-on { flex-direction: column; }
  .spread .page:nth-child(2) { display: none; }
  .spread.cover-only .page:nth-child(2) { display: none; }
}
</style>
</head>
<body>

    <button type="button" class="primary" id="next">Next →</button>

<main class="stage" id="stage"></main>

const spreads = [];

spreads.push({

spreads.push({

    ${imgPage(photos.shop, 'King Road, Mandi Bahauddin', 'Head Office')}
    ${textPage('01 — The Company', 'Print. Brand.<br>Deliver.', `
      <p class="big">Amazon Printings Pvt Ltd — trading as Amazon Printing Services — is a full-service print, branding and advertising house.</p>

spreads.push({
  html: `<div class="spread">
    ${imgPage(photos.desk, 'Leadership', '02')}
    ${textPage('02 — CEO Message', 'Craft you can trust.', `
      <p class="big">Every brand deserves print that feels intentional — sharp colour, reliable timelines, and creative that earns repeat work.</p>

      <p><strong style="color:#F26522">Muhammad Abdullah Sajid</strong><br>Chief Executive Officer</p>`)}

spreads.push({

services.forEach((s, i) => {

    html: `<div class="spread">
      ${imgPage(s.hero, s.title, String(i+5).padStart(2,'0'))}

spreads.push({

    ${imgPage(photos.team, 'People behind the press', 'Team')}

      <p>Departments: Management, Design, Digital, Offset, Large Format, Signage, Finishing, Sales, Marketing, Support, IT, Accounts.</p>`)}

});

spreads.push({
  html: `<div class="spread">
    <div class="page folio">
      <figure><img src="${photos.cards}" alt=""><figcaption>Stationery</figcaption></figure>
      <figure><img src="${photos.pack}" alt=""><figcaption>Packaging</figcaption></figure>

    </div>
    <div class="page folio">

      <figure><img src="${photos.event}" alt=""><figcaption>Events</figcaption></figure>

spreads.push({

spreads.push({

spreads.push({

      <div class="veil"></div>

        <h1>Amazon<br>Printings</h1>
        <div class="rule"></div>

          <small>WhatsApp 0327-6650001</small>

    </div>
  </div>`
});

const stage = document.getElementById('stage');
stage.innerHTML = spreads.map(s => s.html).join('');
const nodes = [...stage.querySelectorAll('.spread')];
let i = 0;
function show() {
  nodes.forEach((n, idx) => n.classList.toggle('is-on', idx === i));
  document.getElementById('count').textContent = (i+1) + ' / ' + nodes.length;
}
document.getElementById('next').onclick = () => { i = Math.min(nodes.length-1, i+1); show(); };
document.getElementById('prev').onclick = () => { i = Math.max(0, i-1); show(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
});
show();
</script>
</body>
</html>
