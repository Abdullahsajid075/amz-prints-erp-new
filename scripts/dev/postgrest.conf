# PostgREST config for local development.
# PostgREST exposes the local Postgres database over the same REST protocol that
# @supabase/supabase-js expects. The supabase-proxy in front of it rewrites the
# Supabase "/rest/v1" path prefix onto PostgREST's root path.
db-uri = "postgres://authenticator:postgres@localhost:5432/amz_erp"
db-schemas = "public"
db-anon-role = "web_anon"
server-host = "127.0.0.1"
server-port = 3001
