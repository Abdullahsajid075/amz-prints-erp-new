<style>
:root {
  --orange: #F26522;
  --orange-deep: #D45512;
  --ink: #0E141B;
  --black: #07090c;
  --muted: #9aa3ae;
  --display: "Unbounded", sans-serif;
  --body: "Manrope", sans-serif;
  --fallback: url("https://images.unsplash.com/photo-1503694978374-8a2fa23213d6?auto=format&fit=crop&w=1200&q=80");
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--body);
  background: #12151a;
  color: #fff;
  overflow: hidden;
}
.bar {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: #0E141B;
  border-bottom: 1px solid rgba(242,101,34,.25);
  gap: 12px;
}
.bar strong { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.bar span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.nav button {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,.2);
  padding: 8px 14px;
  font-family: var(--body);
  font-weight: 700;
  cursor: pointer;
}
.nav button.primary { background: var(--orange); border-color: var(--orange); }
.stage {
  height: calc(100% - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(242,101,34,.12), transparent 50%),
    #1a1e24;
}
.spread {
  display: none;
  filter: drop-shadow(0 30px 50px rgba(0,0,0,.55));
}
.spread.is-on { display: flex; }
.page {
  width: min(38vw, 440px);
  height: min(78vh, 660px);
  position: relative;
  overflow: hidden;
  background: var(--ink);
}
.page--cover, .page--back { width: min(44vw, 500px); }
.bleed {
  position: absolute; inset: 0;
  background-color: #1a120e;
  background-size: cover;
  background-position: center;
}
.bleed::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 42%, rgba(7,9,12,.82));
}
.cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 20px 24px;
  z-index: 2;
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 800;
}
.cap b { color: var(--orange); display: block; font-size: 11px; margin-bottom: 4px; }

.cover {
  background: var(--black);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 40px 36px 44px;
  border: 1px solid rgba(242,101,34,.4);
}
.cover .photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: .42;
  filter: grayscale(.3) contrast(1.12);
}
.cover .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(7,9,12,.15) 0%, rgba(7,9,12,.5) 38%, rgba(7,9,12,.97) 72%);
}
.cover .copy { position: relative; z-index: 2; }
.cover .year {
  font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--orange); font-weight: 800; margin-bottom: 22px;
}
.cover h1 {
  font-family: var(--display);
  font-size: clamp(40px, 5.6vw, 68px);
  line-height: .92;
  font-weight: 800;
  letter-spacing: -.03em;
}
.cover h1 em { font-style: normal; color: var(--orange); display: block; font-size: .72em; margin-top: .08em; }
.cover .rule { width: 88px; height: 5px; background: var(--orange); margin: 26px 0 18px; }
.cover h2 {
  font-family: var(--display);
  font-size: clamp(22px, 2.4vw, 32px);
  font-weight: 700;
  color: #fff;
  line-height: 1.15;
}
.cover h2 small {
  display: block;
  margin-top: 10px;
  font-family: var(--body);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
  color: rgba(255,255,255,.72);
}

.text {
  background: var(--black);
  padding: 32px 28px 24px;
  display: flex;
  flex-direction: column;
}
.text .kicker {
  color: var(--orange);

  letter-spacing: .22em;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 12px;

.text h2 {
  font-family: var(--display);

  line-height: 1.02;
  margin-bottom: 14px;

.text p {

  line-height: 1.5;
  color: rgba(255,255,255,.78);

.meta {

  margin-top: 6px;

.meta th, .meta td {
  text-align: left;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.08);

.meta th {
  color: var(--orange);
  width: 38%;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;

.toc { list-style: none; margin-top: 6px; overflow: auto; flex: 1; }
.toc li {
  display: grid;
  grid-template-columns: 2rem 1fr;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dotted rgba(255,255,255,.16);
  font-size: 13px;
  font-weight: 700;
}
.toc b { color: var(--orange); }

.subs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 6px;
  overflow: auto;
  flex: 1;
  min-height: 0;
}
.sub {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 8px;
  align-items: center;
  background: #12161c;
  border: 1px solid rgba(255,255,255,.07);
  padding: 6px;
  min-height: 60px;
}
.sub img {
  width: 48px; height: 48px; object-fit: cover; display: block; background: #2a211c;
}
.sub span { font-size: 11px; font-weight: 700; line-height: 1.25; }

.values { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 6px; overflow: auto; flex: 1; }
.values div {
  border: 1px solid rgba(242,101,34,.4);
  padding: 11px 12px;
  font-size: 12px;
  font-weight: 800;
  background: #120e0c;
}

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.stat {
  background: #12161c;
  border: 1px solid rgba(242,101,34,.3);
  padding: 12px 10px;
  text-align: center;
}
.stat strong {
  display: block;
  font-family: var(--display);
  font-size: 26px;
  color: var(--orange);
  line-height: 1;
}
.stat span { font-size: 11px; color: var(--muted); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips span {
  font-size: 11px;
  font-weight: 700;
  padding: 6px 8px;
  border: 1px solid rgba(242,101,34,.35);
  background: rgba(242,101,34,.08);

.folio { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 100%; padding: 14px; background: var(--black); }
.folio figure { margin: 0; position: relative; overflow: hidden; background: #1a120e; }
.folio img { width: 100%; height: 100%; object-fit: cover; display: block; }
.folio figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 8px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.85));

.contact { background: var(--black); padding: 32px 28px; display: flex; flex-direction: column; }
.contact h2 { font-family: var(--display); font-size: 34px; margin: 8px 0 16px; }
.contact p { font-size: 15px; line-height: 1.5; margin: 5px 0; }
.contact .wa { color: var(--orange); font-weight: 800; font-size: 20px; margin-top: 14px; }

.why { list-style: none; overflow: auto; flex: 1; }

  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
  font-size: 12.5px;
  font-weight: 650;

@media (max-width: 900px) {
  .spread.is-on { flex-direction: column; }
  .page, .page--cover, .page--back { width: min(92vw, 440px); height: min(58vh, 560px); }
}
</style>

const stage = document.getElementById('stage');
stage.innerHTML = spreads.join('');
const nodes = [...stage.querySelectorAll('.spread')];
let i = 0;
function show() {
  nodes.forEach((n, idx) => n.classList.toggle('is-on', idx === i));
  document.getElementById('count').textContent = (i + 1) + ' / ' + nodes.length;
}
document.getElementById('next').onclick = () => { i = Math.min(nodes.length - 1, i + 1); show(); };
document.getElementById('prev').onclick = () => { i = Math.max(0, i - 1); show(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); document.getElementById('next').click(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); document.getElementById('prev').click(); }
});
document.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'IMG' && e.target.src !== FALLBACK) e.target.src = FALLBACK;
}, true);
show();
</script>
